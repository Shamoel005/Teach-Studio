name: Build Teach Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent "Teach Studio.app" TeachStudio.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TeachStudio
          path: TeachStudio.zip
